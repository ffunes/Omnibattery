site_name: Omnibattery
site_description: Home Assistant custom integration for pluggable solar batteries (Marstek Venus and Zendure SolarFlow)
site_author: ffunes
site_url: https://ffunes.github.io/omnibattery/
repo_url: https://github.com/ffunes/omnibattery
repo_name: ffunes/omnibattery
edit_uri: edit/main/site-docs/

docs_dir: site-docs
site_dir: _site

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro / Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro / Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - redirects:
      redirect_maps:
        blueprints.md: automations/blueprints.md
        es/blueprints.md: https://ffunes.github.io/omnibattery/es/automations/blueprints/
        reference/shelly-pro-3em-mqtt-script.md: hardware/shelly-pro-3em-mqtt-script.md
        es/reference/shelly-pro-3em-mqtt-script.md: https://ffunes.github.io/omnibattery/es/hardware/shelly-pro-3em-mqtt-script/
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Get started: Empezar
            Installation guide: Guía de instalación
            Configure: Configurar
            Start here: Empieza aquí
            Sensors and electrical limits: Sensores y límites eléctricos
            Main sensor: Sensor principal
            Three-phase current protection: Protección de corriente trifásica
            Your battery: Tu batería
            Choose a brand: Elegir marca
            Marstek: Marstek
            Zendure: Zendure
            Anker SOLIX: Anker SOLIX
            Sessy: Sessy
            Hoymiles MQTT: Hoymiles MQTT
            Hoymiles MS-A2 setup: Instalación de Hoymiles MS-A2
            Time slots: Franjas horarias
            Large loads and EV chargers: Cargas grandes y cargadores VE
            Excluded devices: Dispositivos excluidos
            Load exclusion: Exclusión de cargas
            Predictive charging: Carga predictiva
            Which mode should I choose?: ¿Qué modo elijo?
            Time Slot mode: Modo Franja Horaria
            Dynamic Pricing mode: Modo Precio Dinámico
            Real-Time Price mode: Modo Precio en Tiempo Real
            Features: Funcionalidades
            Follow home consumption: Seguir el consumo de casa
            PD Controller: Controlador PD
            Hourly net balance: Balance neto horario
            Make the most of solar: Aprovechar el sol
            Daily consumption estimate: Estimación de consumo diario
            Solar charge delay: Retraso de carga solar
            Protect your installation: Proteger la instalación
            Peak shaving: Peak shaving
            Temperature charge limit: Límite de carga por temperatura
            Care for your battery: Cuidar la batería
            Weekly full charge: Carga semanal completa
            Cell balance monitor: Monitor de equilibrio de celdas
            Multiple batteries: Varias baterías
            Daily operation timeline: Cronología diaria
            Hardware and meters: Hardware y medidores
            Shelly Pro 3EM MQTT scripts: Scripts MQTT para Shelly Pro 3EM
            Automations: Automatizaciones
            Blueprints: Blueprints
            Support: Soporte
            Troubleshooting: Solución de problemas
            Changelog: Changelog
            Reference: Referencia
            HA entities: Entidades HA
            Modbus registers: Registros Modbus
            Overview: Resumen
            Complete register table: Tabla completa de registros
            Contribute: Contribuir
            Architecture: Arquitectura
            Battery driver requirements: Requisitos para drivers de batería

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ffunes/omnibattery
    - icon: fontawesome/solid/mug-hot
      link: https://buymeacoffee.com/ffunes
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Installation guide: installation.md
  - Configure:
      - Start here: configuration/index.md
      - Sensors and electrical limits:
          - Main sensor: configuration/main-sensor.md
          - Three-phase current protection: configuration/three-phase.md
      - Your battery:
          - Choose a brand: configuration/batteries/index.md
          - Marstek: configuration/batteries/marstek.md
          - Zendure: configuration/batteries/zendure.md
          - Anker SOLIX: configuration/batteries/anker.md
          - Sessy: configuration/batteries/sessy.md
          - Hoymiles MQTT: configuration/batteries/hoymiles.md
          - Hoymiles MS-A2 setup: configuration/hoymiles-ms-a2.md
      - Time slots: configuration/time-slots.md
      - Large loads and EV chargers:
          - Excluded devices: configuration/excluded-devices.md
          - Load exclusion: features/load-exclusion.md
      - Predictive charging:
          - Which mode should I choose?: configuration/predictive-charging/index.md
          - Time Slot mode: configuration/predictive-charging/time-slot.md
          - Dynamic Pricing mode: configuration/predictive-charging/dynamic-pricing.md
          - Real-Time Price mode: configuration/predictive-charging/real-time-price.md
  - Features:
      - Follow home consumption:
          - PD Controller: features/pd-controller.md
          - Hourly net balance: features/hourly-net-balance.md
      - Make the most of solar:
          - Daily consumption estimate: features/consumption-estimate.md
          - Solar charge delay: features/solar-charge-delay.md
      - Protect your installation:
          - Peak shaving: features/peak-shaving.md
          - Temperature charge limit: features/temperature-charge-limit.md
      - Care for your battery:
          - Weekly full charge: features/weekly-full-charge.md
          - Cell balance monitor: features/cell-balance-monitor.md
      - Multiple batteries: features/multi-battery.md
      - Daily operation timeline: features/daily-operation-timeline.md
  - Hardware and meters:
      - Shelly Pro 3EM MQTT scripts: hardware/shelly-pro-3em-mqtt-script.md
  - Automations:
      - Blueprints: automations/blueprints.md
  - Support:
      - Troubleshooting: troubleshooting.md
      - Changelog: changelog.md
  - Reference:
      - HA entities: reference/entities.md
      - Modbus registers:
          - Overview: reference/modbus-registers.md
          - Complete register table: reference/registers.md
  - Contribute:
      - Architecture: reference/architecture.md
      - Battery driver requirements: reference/driver-requirements-template.md
