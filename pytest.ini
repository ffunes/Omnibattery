[pytest]
testpaths = tests
asyncio_mode = auto

# The Home Assistant pytest plugin registers autouse fixtures that build a full
# HA event loop for every test. On Windows that loop needs a local socketpair
# which pytest-socket (bundled with the plugin) blocks, so the plugin makes the
# whole suite error at setup. These unit tests use none of the plugin's fixtures
# (no `hass`), so disabling it gives a fast run that is green on Windows and Linux.
# Future integration tests that need the `hass` fixture should re-enable the plugin
# (drop this flag) and run on Linux/CI.
addopts = -p no:homeassistant -m "not sweep"
# A test that hangs fails after 5 minutes with its stack (pytest-timeout)
# instead of blocking the run forever. The slowest test takes ~7 s.
timeout = 300
# The invariant sweep (tests/test_predictive_sweep.py) takes minutes: run it
# with `pytest -m sweep -n auto` (the .githooks/pre-merge-commit hook does).
markers =
    sweep: invariant sweep of the Dynamic Pricing planner (slow; pytest -m sweep -n auto)
    weekly_sweep: the Weekly Full Charge part of the sweep (pytest -m weekly_sweep -n auto)
